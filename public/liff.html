<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>里民許願池表單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f0f9ff',
                100: '#e0f2fe',
                500: '#0ea5e9',
                600: '#0284c7',
                700: '#0369a1',
              },
              accent: {
                50: '#fdf4ff',
                100: '#fae8ff',
                500: '#d946ef',
              },
            },
            boxShadow: {
              soft: '0 24px 60px -24px rgba(15, 23, 42, 0.28)',
            },
          },
        },
      };
    </script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body class="min-h-screen bg-slate-100 font-sans text-slate-900">
    <div class="relative overflow-hidden">
      <div class="absolute inset-x-0 top-0 h-72 bg-gradient-to-br from-sky-500 via-cyan-400 to-indigo-500"></div>
      <div class="absolute left-1/2 top-10 h-48 w-48 -translate-x-1/2 rounded-full bg-white/20 blur-3xl"></div>

      <main class="relative mx-auto flex min-h-screen max-w-lg flex-col px-4 py-6 sm:px-6">
        <section class="rounded-[28px] bg-white/95 p-6 shadow-soft ring-1 ring-white/70 backdrop-blur">
          <div class="flex items-start justify-between gap-4">
            <div>
              <p class="text-sm font-medium text-sky-700">里長服務平台</p>
              <h1 class="mt-2 text-2xl font-semibold tracking-tight text-slate-900">
                里民許願池表單
              </h1>
              <p class="mt-2 text-sm leading-relaxed text-slate-600">
                歡迎留下您的建議、需求與需要協助的地方，我們會盡快了解並回應。
              </p>
            </div>
            <span
              id="modeBadge"
              class="rounded-full bg-sky-50 px-3 py-1 text-xs font-semibold text-sky-700 ring-1 ring-sky-100"
            >
              初始化中
            </span>
          </div>

          <div class="mt-5 rounded-2xl bg-slate-50 p-4 ring-1 ring-slate-200">
            <div class="flex items-center justify-between gap-3">
              <div>
                <p class="text-xs font-semibold uppercase tracking-[0.24em] text-slate-400">
                  使用者識別
                </p>
                <p id="profileName" class="mt-1 text-base font-semibold text-slate-900">
                  尚未取得 LINE 身分
                </p>
              </div>
              <div class="rounded-full bg-white px-3 py-1 text-xs font-medium text-slate-500 ring-1 ring-slate-200">
                LINE / 測試模式
              </div>
            </div>
            <p id="profileHint" class="mt-3 break-all text-xs leading-relaxed text-slate-500">
              目前尚未建立身分資訊，系統將嘗試自動初始化。
            </p>
          </div>

          <div
            id="statusMessage"
            class="mt-4 rounded-2xl border border-sky-100 bg-sky-50 px-4 py-3 text-sm leading-relaxed text-sky-700"
          >
            正在準備表單與 LIFF 環境...
          </div>

          <div
            id="testModePanel"
            class="mt-4 hidden rounded-2xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900"
          >
            <div class="flex items-start justify-between gap-4">
              <div>
                <p class="font-semibold">測試模式已啟用</p>
                <p class="mt-1 leading-relaxed text-amber-800">
                  目前不是 LIFF 已登入環境，您仍可在一般瀏覽器測試送出流程。
                </p>
              </div>
              <button
                id="generateMockIdButton"
                type="button"
                class="rounded-xl bg-amber-500 px-3 py-2 text-xs font-semibold text-white transition-all duration-200 hover:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500/30"
              >
                重新產生 ID
              </button>
            </div>

            <label class="mt-4 block text-xs font-semibold text-amber-900" for="mockLineId">
              測試用 LINE User ID
            </label>
            <input
              id="mockLineId"
              type="text"
              class="mt-2 w-full rounded-2xl border border-amber-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm transition-all duration-200 focus:border-amber-400 focus:outline-none focus:ring-2 focus:ring-amber-500/20"
              placeholder="可手動輸入，或點上方按鈕自動產生"
            />
          </div>

          <form id="feedbackForm" class="mt-6 space-y-4">
            <input id="line_user_id" name="line_user_id" type="hidden" />

            <div>
              <label for="user_name" class="mb-2 block text-sm font-semibold text-slate-700">
                里民姓名
              </label>
              <input
                id="user_name"
                name="user_name"
                type="text"
                required
                maxlength="100"
                class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm transition-all duration-200 placeholder:text-slate-400 focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20"
                placeholder="請輸入您的姓名或暱稱"
              />
            </div>

            <div>
              <label for="phone" class="mb-2 block text-sm font-semibold text-slate-700">
                聯絡電話
              </label>
              <input
                id="phone"
                name="phone"
                type="tel"
                required
                maxlength="30"
                class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm transition-all duration-200 placeholder:text-slate-400 focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20"
                placeholder="例如 0912-345-678"
              />
            </div>

            <div>
              <label for="category" class="mb-2 block text-sm font-semibold text-slate-700">
                反映類別
              </label>
              <select
                id="category"
                name="category"
                required
                class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm transition-all duration-200 focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20"
              >
                <option value="">請選擇類別</option>
                <option value="環境">環境維護</option>
                <option value="治安">治安安全</option>
                <option value="銀髮">銀髮關懷</option>
                <option value="親子">親子友善</option>
                <option value="其他">其他</option>
              </select>
            </div>

            <div>
              <label for="content" class="mb-2 block text-sm font-semibold text-slate-700">
                具體建議內容
              </label>
              <textarea
                id="content"
                name="content"
                required
                rows="6"
                maxlength="2000"
                class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm leading-relaxed text-slate-900 shadow-sm transition-all duration-200 placeholder:text-slate-400 focus:border-sky-400 focus:outline-none focus:ring-2 focus:ring-sky-500/20"
                placeholder="請描述您希望改善的內容、遇到的問題，或想提出的建議。"
              ></textarea>
            </div>

            <button
              id="submitButton"
              type="submit"
              class="w-full rounded-2xl bg-slate-900 px-4 py-3.5 text-sm font-semibold text-white shadow-lg shadow-slate-900/15 transition-all duration-200 hover:-translate-y-0.5 hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-slate-900/20 disabled:cursor-not-allowed disabled:opacity-60"
            >
              送出里民建議
            </button>
          </form>

          <p class="mt-4 text-center text-xs leading-relaxed text-slate-500">
            在 LINE 內開啟可自動帶入身分；一般瀏覽器則可使用測試模式驗證送出流程。
          </p>
        </section>
      </main>
    </div>

    <script>
      const state = {
        mode: 'loading',
        candidateName: 'ＯＯ',
        liffFormUrl: '',
      };

      const elements = {
        feedbackForm: document.getElementById('feedbackForm'),
        lineUserId: document.getElementById('line_user_id'),
        userName: document.getElementById('user_name'),
        phone: document.getElementById('phone'),
        category: document.getElementById('category'),
        content: document.getElementById('content'),
        submitButton: document.getElementById('submitButton'),
        statusMessage: document.getElementById('statusMessage'),
        modeBadge: document.getElementById('modeBadge'),
        testModePanel: document.getElementById('testModePanel'),
        mockLineId: document.getElementById('mockLineId'),
        generateMockIdButton: document.getElementById('generateMockIdButton'),
        profileName: document.getElementById('profileName'),
        profileHint: document.getElementById('profileHint'),
      };

      document.addEventListener('DOMContentLoaded', bootstrap);

      async function bootstrap() {
        bindEvents();
        setStatus('正在初始化 LIFF 與表單...', 'info');

        try {
          const config = await fetchRuntimeConfig();
          state.candidateName = config.candidateName || state.candidateName;
          state.liffFormUrl = window.location.href;

          await initializeIdentity(config);
        } catch (error) {
          console.error('Bootstrap failed:', error);
          enableTestMode('載入前端設定失敗，已切換為測試模式。');
        }
      }

      function bindEvents() {
        elements.generateMockIdButton.addEventListener('click', () => {
          const mockId = generateMockLineId();
          elements.mockLineId.value = mockId;
          updateIdentity({
            lineUserId: mockId,
            displayName: elements.userName.value.trim() || '測試里民',
            hint: '您目前使用測試模式，可直接送出表單驗證流程。',
          });
          setStatus('已重新產生測試用 LINE User ID。', 'warning');
        });

        elements.mockLineId.addEventListener('input', (event) => {
          const mockId = event.target.value.trim();
          if (!mockId) {
            return;
          }

          updateIdentity({
            lineUserId: mockId,
            displayName: elements.userName.value.trim() || '測試里民',
            hint: '目前使用手動輸入的測試 LINE User ID。',
          });
        });

        elements.feedbackForm.addEventListener('submit', handleSubmit);
      }

      async function fetchRuntimeConfig() {
        const response = await fetch('/api/config');
        if (!response.ok) {
          throw new Error('Failed to load runtime config');
        }
        return response.json();
      }

      async function initializeIdentity(config) {
        if (!window.liff) {
          enableTestMode('LIFF SDK 載入失敗，已切換為測試模式。');
          return;
        }

        if (!config.liffId) {
          enableTestMode('尚未設定 LIFF_ID，已切換為測試模式。');
          return;
        }

        try {
          await liff.init({ liffId: config.liffId });

          if (!liff.isLoggedIn()) {
            enableTestMode('目前不在 LIFF 已登入環境，已切換為測試模式。');
            return;
          }

          const profile = await liff.getProfile();
          updateIdentity({
            lineUserId: profile.userId,
            displayName: profile.displayName || 'LINE 使用者',
            hint: `已透過 LINE ${liff.isInClient() ? '應用內' : '外部瀏覽器'}身分取得使用者資料。`,
          });

          elements.modeBadge.textContent = 'LIFF 模式';
          elements.modeBadge.className =
            'rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-700 ring-1 ring-emerald-100';

          if (!elements.userName.value.trim()) {
            elements.userName.value = profile.displayName || '';
          }

          setStatus('已成功取得 LINE Profile，表單可直接送出。', 'success');
        } catch (error) {
          console.error('LIFF initialization failed:', error);
          enableTestMode('LIFF 初始化失敗，已切換為測試模式。');
        }
      }

      function enableTestMode(message) {
        state.mode = 'test';
        elements.testModePanel.classList.remove('hidden');
        elements.modeBadge.textContent = '測試模式';
        elements.modeBadge.className =
          'rounded-full bg-amber-50 px-3 py-1 text-xs font-semibold text-amber-700 ring-1 ring-amber-100';

        if (!elements.mockLineId.value.trim()) {
          elements.mockLineId.value = generateMockLineId();
        }

        updateIdentity({
          lineUserId: elements.mockLineId.value.trim(),
          displayName: elements.userName.value.trim() || '測試里民',
          hint: '目前以測試模式運作，可手動修改或重新產生 LINE User ID。',
        });

        setStatus(message, 'warning');
      }

      function updateIdentity({ lineUserId, displayName, hint }) {
        elements.lineUserId.value = lineUserId;
        elements.profileName.textContent = displayName;
        elements.profileHint.textContent = `LINE User ID：${lineUserId}\n${hint}`;
      }

      function generateMockLineId() {
        const randomChunk = crypto.getRandomValues(new Uint32Array(2))
          .join('')
          .slice(0, 20);
        return `U_TEST_${Date.now()}_${randomChunk}`;
      }

      async function handleSubmit(event) {
        event.preventDefault();

        if (!elements.lineUserId.value.trim()) {
          enableTestMode('尚未取得 LINE User ID，已自動切換至測試模式。');
        }

        const payload = {
          line_user_id: elements.lineUserId.value.trim(),
          user_name: elements.userName.value.trim(),
          phone: elements.phone.value.trim(),
          category: elements.category.value,
          content: elements.content.value.trim(),
        };

        toggleSubmitting(true);
        setStatus('資料送出中，請稍候...', 'info');

        try {
          const response = await fetch('/api/feedback', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload),
          });

          const result = await response.json();

          if (!response.ok) {
            throw new Error(result.message || '資料送出失敗');
          }

          elements.category.value = '';
          elements.content.value = '';

          setStatus(result.message || '感謝您的建議，我們已收到。', 'success');
        } catch (error) {
          console.error('Submit failed:', error);
          setStatus(error.message || '送出失敗，請稍後再試。', 'error');
        } finally {
          toggleSubmitting(false);
        }
      }

      function toggleSubmitting(isSubmitting) {
        elements.submitButton.disabled = isSubmitting;
        elements.submitButton.textContent = isSubmitting ? '送出中...' : '送出里民建議';
      }

      function setStatus(message, tone) {
        const toneClassMap = {
          info: 'border-sky-100 bg-sky-50 text-sky-700',
          success: 'border-emerald-100 bg-emerald-50 text-emerald-700',
          warning: 'border-amber-200 bg-amber-50 text-amber-800',
          error: 'border-rose-100 bg-rose-50 text-rose-700',
        };

        elements.statusMessage.textContent = message;
        elements.statusMessage.className = `mt-4 rounded-2xl border px-4 py-3 text-sm leading-relaxed ${toneClassMap[tone] || toneClassMap.info}`;
      }
    </script>
  </body>
</html>
